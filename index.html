<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>九九チャレンジ！</title>
<style>
:root{--blue:#a18bd8;--pale:#f3efff;--ink:#665f78;--green:#72bfa5;--red:#e58da5;--yellow:#fff5d9;--pink:#fff0f6}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 12%,#fff 0 5px,transparent 6px),radial-gradient(circle at 88% 20%,#fff 0 7px,transparent 8px),linear-gradient(135deg,#f1edff,#fff0f6 52%,#fff8df);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:var(--ink);min-height:100vh;padding:22px}
main{max-width:760px;margin:0 auto}.app{background:#ffffffed;border:3px solid #fff;border-radius:30px;padding:clamp(20px,4vw,36px);box-shadow:0 12px 35px #789bb522}h1{text-align:center;margin:0 0 8px;font-size:clamp(27px,5vw,38px);color:var(--blue)}.subtitle{text-align:center;color:#718096;margin:0 0 25px}.screen{display:none}.screen.active{display:block}.section-title{font-size:20px;margin:0 0 14px}.dan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.all-dan{grid-column:1/-1;background:#fff3f5!important;border-color:#f2cbd4!important;color:#c8798b!important}.cheer{font-size:clamp(34px,7vw,48px);margin:4px 0 8px}.dan{border:2px solid #d8e4f2;border-radius:14px;padding:13px;background:#fff;font-size:18px;font-weight:700;cursor:pointer}.dan.selected{background:var(--pale);border-color:var(--blue);color:var(--blue)}button{font:inherit}.primary,.secondary{border:0;border-radius:14px;padding:14px 22px;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:#fff;width:100%;font-size:19px;box-shadow:0 4px 0 #8270bd}.primary:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#edf2f7;color:#40516b}.quit-btn{background:#e2e8f0;color:#4a5568;border:0;border-radius:8px;padding:4px 10px;font-size:13px;font-weight:700;cursor:pointer}.hint{font-size:13px;color:#78869a;line-height:1.6}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#6c7b91;font-weight:700}.progress{height:10px;background:#edf1f6;border-radius:20px;overflow:hidden;margin:12px 0 25px}.bar{height:100%;width:0;background:var(--green);transition:width .2s}.question{font-size:clamp(42px,9vw,66px);font-weight:900;text-align:center;margin:25px 0 20px;letter-spacing:2px}.answer-wrap{display:flex;justify-content:center;align-items:center;gap:10px}.answer{width:180px;text-align:center;border:3px solid #d5e1ef;border-radius:16px;padding:12px;font-size:36px;font-weight:800;color:var(--blue);outline:none;background:#fff}.feedback{height:32px;text-align:center;font-weight:800;margin:12px 0 0}.feedback.good{color:var(--green)}.feedback.bad{color:var(--red)}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:330px;margin:18px auto 0}.keypad button{padding:13px;border:1px solid #dbe4ef;border-radius:12px;background:#f8fbff;font-size:22px;font-weight:800;cursor:pointer}.keypad button:active{background:var(--pale)}.keypad .del{font-size:16px}.summary{text-align:center;background:var(--pale);border-radius:18px;padding:18px;margin:15px 0}.score{font-size:38px;font-weight:900;color:var(--blue)}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px;margin:14px 0}th,td{padding:10px 8px;border-bottom:1px solid #e7edf4;text-align:center;white-space:nowrap}th{background:#f5f8fc}.ok{color:var(--green);font-weight:800}.ng{color:var(--red);font-weight:800}.weak{background:var(--yellow);padding:12px 15px;border-radius:12px;margin:8px 0;line-height:1.6}.ranking{padding-left:24px}.ranking li{padding:7px 4px;border-bottom:1px solid #edf1f5}.muted{color:#8290a3}.row-actions{display:flex;gap:10px;margin-top:20px}.row-actions>*{flex:1}.small{font-size:12px;color:#8290a3}@media(max-width:480px){body{padding:10px}.app{border-radius:18px;padding:20px 15px}.dan-grid{gap:7px}.dan{padding:12px 5px;font-size:16px}.keypad{max-width:100%}}
</style>
</head>
<body>
<main><div class="app">
<h1>🌈 九九チャレンジ！</h1><p class="subtitle">たのしくチャレンジ！めざせ九九マスター ✨</p>
<section id="setup" class="screen active">
<h2 class="section-title">出題する段をえらんでね</h2>
<p class="hint">いくつえらんでもOK！えらんだ段からランダムに出題するよ。</p>
<div class="dan-grid" id="danGrid"><button class="dan all-dan" id="allDanBtn" type="button">🌈 すべての段</button></div>
<p class="hint" id="questionCount">出題数：10問</p>
<button class="primary" id="startBtn">ゲームスタート！</button>
<p class="hint">💡 まちがえた問題や、時間がかかった問題は、次回から少し出やすくなるよ。</p>
</section>
<section id="play" class="screen">
<div class="topline">
  <button class="quit-btn" id="quitBtn">✕ やめる</button>
  <span id="progressText">1 / 10 問</span>
  <span id="elapsed">⏱ 0.0秒</span>
</div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="question" id="question">3 × 4 = ?</div>
<div class="answer-wrap"><div id="answer" class="answer" aria-label="答え">？</div></div>
<div id="feedback" class="feedback" aria-live="polite"></div>
<div class="keypad" id="keypad"><button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button data-key="0">0</button><button class="del" data-key="clear">けす</button></div>
<p class="small" style="text-align:center">画面のボタンやパソコンのキーボードで入力できるよ</p>
</section>
<section id="result" class="screen">
<h2 class="section-title">🎉 チャレンジ結果</h2>
<div class="summary"><div class="cheer" id="resultMascot">🎉 ⭐ 🎉</div><div class="score" id="score">8 / 10 問正解</div><div id="totalTime">合計 35.2 秒</div><div id="resultMessage" class="hint"></div></div>
<h3>今回の答え合わせ</h3><div class="table-wrap"><table><thead><tr><th>問題</th><th>あなたの答え</th><th>正解</th><th>結果</th><th>時間</th></tr></thead><tbody id="resultRows"></tbody></table></div>
<h3>💡 これからの練習ポイント</h3><div id="weakList"></div>
<h3>🏆 ベストランキング</h3><p class="hint">正解数が多い順、同じ正解数なら合計時間が短い順だよ。</p><ol class="ranking" id="ranking"></ol>
<div class="row-actions"><button class="secondary" id="homeBtn">段をえらび直す</button><button class="primary" id="againBtn">もう一度！</button></div>
</section>
</div></main>
<script>
(()=>{
const $=id=>document.getElementById(id);
const STORE='kukuChallenge_v2';
let selected=new Set([1,2,3,4,5,6,7,8,9]),questions=[],results=[],index=0,questionStarted=0,sessionStarted=0,timer=null,locked=false,audioCtx=null,currentInput='';
let data=loadData();
function loadData(){try{const current=JSON.parse(localStorage.getItem(STORE));if(current)return current;const old=JSON.parse(localStorage.getItem('kukuChallenge_v1'));return {history:old?.history||{},ranking:[]}}catch{return {history:{},ranking:[]}}}
function saveData(){try{localStorage.setItem(STORE,JSON.stringify(data))}catch{}}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active')}
function renderDans(){
  const grid=$('danGrid');
  grid.innerHTML='';
  const all=document.createElement('button');
  const isAllSelected = selected.size === 9;
  all.className='dan all-dan'+(isAllSelected?' selected':'');
  all.textContent=isAllSelected ? '❌ すべて解除' : '🌈 すべての段';
  all.setAttribute('aria-pressed',isAllSelected);
  all.onclick=()=>{
    if(selected.size===9){
      selected.clear();
    }else{
      selected=new Set([1,2,3,4,5,6,7,8,9]);
    }
    renderDans();
  };
  grid.appendChild(all);
  for(let n=1;n<=9;n++){
    const b=document.createElement('button');
    b.className='dan'+(selected.has(n)?' selected':'');
    b.textContent=n+'の段';
    b.setAttribute('aria-pressed',selected.has(n));
    b.onclick=()=>{
      if(selected.has(n))selected.delete(n);
      else selected.add(n);
      renderDans();
    };
    grid.appendChild(b);
  }
  if(selected.size===0){
    $('questionCount').textContent='出題する段を選択してください';
  }else{
    $('questionCount').textContent=selected.size===1?'出題数：9問（この段の全問題）':'出題数：10問';
  }
}
function uniqueQuestions(){const pool=[];for(const a of selected)for(let b=1;b<=9;b++){const key=a+'x'+b;pool.push({a,b,key,answer:a*b})}return pool}
function makeQuestions(){let pool=uniqueQuestions();const count=selected.size===1?9:10;const weighted=pool.map(q=>{const h=data.history[q.key]||{wrong:0,slow:0};return {...q,weight:1+h.wrong*2+h.slow*1.5}});const chosen=[];while(chosen.length<count&&weighted.length){let total=weighted.reduce((s,q)=>s+q.weight,0),r=Math.random()*total,idx=0;for(;idx<weighted.length-1;idx++){r-=weighted[idx].weight;if(r<=0)break}chosen.push(weighted.splice(idx,1)[0])}return chosen}
function start(){if(!selected.size){alert('段を1つ以上えらんでね');return}clearInterval(timer);questions=makeQuestions();results=[];index=0;sessionStarted=performance.now();locked=false;show('play');startQuestion();}
function startQuestion(){
  locked=false;
  currentInput='';
  const q=questions[index];
  $('question').textContent=`${q.a} × ${q.b} = ?`;
  $('answer').textContent='？';
  $('feedback').textContent='';
  $('feedback').className='feedback';
  $('progressText').textContent=`${index+1} / ${questions.length} 問`;
  $('bar').style.width=(index/questions.length*100)+'%';
  questionStarted=performance.now();
  clearInterval(timer);
  timer=setInterval(()=>$('elapsed').textContent='⏱ '+((performance.now()-questionStarted)/1000).toFixed(1)+'秒',100);
  $('elapsed').textContent='⏱ 0.0秒';
}
function sound(ok){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.connect(gain);gain.connect(audioCtx.destination);osc.type='sine';osc.frequency.value=ok?880:220;gain.gain.setValueAtTime(.0001,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.18,audioCtx.currentTime+.015);gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.19);osc.start();osc.stop(audioCtx.currentTime+.2);if(ok){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=1175;g.gain.setValueAtTime(.0001,audioCtx.currentTime+.12);g.gain.exponentialRampToValueAtTime(.12,audioCtx.currentTime+.14);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.3);o.start(audioCtx.currentTime+.12);o.stop(audioCtx.currentTime+.31)}}catch(e){}}
function handleInput(val){
  if(locked)return;
  if(val==='clear'){
    currentInput='';
  }else{
    if(currentInput.length<2) currentInput+=val;
  }
  $('answer').textContent=currentInput===''?'？':currentInput;
  
  const q=questions[index],digits=String(q.answer).length;
  if(currentInput.length===digits){
    submitAnswer();
  }
}
function submitAnswer(){
  if(locked)return;
  const raw=currentInput;
  if(!raw || !/^[0-9]+$/.test(raw)) return;
  const q=questions[index];
  const elapsed=(performance.now()-questionStarted)/1000;
  const correct=Number(raw)===q.answer;
  locked=true;
  const hist=data.history[q.key]||(data.history[q.key]={wrong:0,slow:0,attempts:0});
  hist.attempts++;
  if(!correct)hist.wrong++;
  if(elapsed>=5)hist.slow++;
  results.push({a:q.a,b:q.b,answer:q.answer,user:Number(raw),correct,time:elapsed,key:q.key});
  sound(correct);
  $('feedback').textContent=correct?'⭕ せいかい！':'❌ おしい！つぎの問題へ！';
  $('feedback').className='feedback '+(correct?'good':'bad');
  $('bar').style.width=((index+1)/questions.length*100)+'%';
  setTimeout(next,correct?420:700);
}
function next(){index++;if(index>=questions.length)finish();else startQuestion()}
function finish(){clearInterval(timer);const total=(performance.now()-sessionStarted)/1000,correct=results.filter(r=>r.correct).length;results.forEach(r=>{const h=data.history[r.key];h.lastTime=r.time;h.lastCorrect=r.correct});data.ranking.push({correct,total,date:new Date().toLocaleDateString('ja-JP')});data.ranking.sort((a,b)=>b.correct-a.correct||a.total-b.total);data.ranking=data.ranking.slice(0,5);saveData();$('score').textContent=`${correct} / ${questions.length} 問正解`;$('totalTime').textContent=`合計 ${total.toFixed(1)} 秒`;$('resultMascot').textContent=correct===questions.length?'🌟🎊🌟':'🌷✨';$('resultMessage').textContent=correct===questions.length?'ぜんもんせいかい！すごい！パーフェクト！':`${questions.length-correct}問まちがえたところがあったね。つぎはきっとできるよ！`;$('resultRows').innerHTML=results.map(r=>`<tr><td>${r.a} × ${r.b}</td><td>${r.user}</td><td>${r.answer}</td><td class="${r.correct?'ok':'ng'}">${r.correct?'○ 正解':'× 不正解'}</td><td>${r.time.toFixed(1)}秒</td></tr>`).join('');renderWeak();renderRanking();show('result')}
function renderWeak(){const candidates=results.filter(r=>!r.correct||r.time>=5).sort((a,b)=>(Number(!b.correct)-Number(!a.correct))||(b.time-a.time));const box=$('weakList');if(!candidates.length){box.innerHTML='<p class="weak">すばらしい！ミスや時間のかかった問題はなかったよ。この調子！</p>';return}box.innerHTML=candidates.slice(0,5).map(r=>`<div class="weak"><strong>${r.a} × ${r.b} = ${r.answer}</strong><br>${!r.correct?'今回は '+r.user+' と答えてまちがえたよ。':'正解！'} ${r.time>=5?'答えるまで '+r.time.toFixed(1)+' 秒かかったよ。':''}次回も出題されやすくしておくね。</div>`).join('')}
function renderRanking(){$('ranking').innerHTML=data.ranking.length?data.ranking.map((r,i)=>`<li><strong>${i+1}位</strong> ${r.correct}問正解・${r.total.toFixed(1)}秒 <span class="muted">(${r.date})</span></li>`).join(''):'<li>まだ記録がないよ</li>'}
function quitGame(){
  if(confirm('プレイをやめて最初の画面にもどる？（記録はのこりません）')){
    clearInterval(timer);
    renderDans();
    show('setup');
  }
}
$('startBtn').onclick=start;$('againBtn').onclick=start;$('homeBtn').onclick=()=>{renderDans();show('setup')};$('quitBtn').onclick=quitGame;

$('keypad').addEventListener('click',e=>{const key=e.target.dataset.key;if(!key)return;handleInput(key==='clear'?'clear':key)});

document.addEventListener('keydown',e=>{
  if(!$('play').classList.contains('active'))return;
  if(/^[0-9]$/.test(e.key)){
    handleInput(e.key);
  }else if(e.key==='Backspace'){
    handleInput('clear');
  }
});
renderDans();
})();
</script>
</body>
</html>
